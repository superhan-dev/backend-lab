version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: olist-postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: olist_dataset
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    volumes:
      - ./data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist_user -d olist"]
      interval: 10s
      timeout: 5s
      retries: 5
