version: "3.8"
services:
  db:
    image: postgres:16
    container_name: ranking-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ranking
    ports:
      - "15432:5432"
    volumes:
      - ranking-db-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: ranking-redis
    ports:
      - "16379:6379"

volumes:
  ranking-db-data:
